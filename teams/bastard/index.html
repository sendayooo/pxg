<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bastard München — Elenco</title><style>

r(--gold);letter-spacing:.16em;text-transform:uppercase;font-weight:800}.name{font-size:23px;font-weight:800;margin:4px 0}.sub{font-size:12px;color:var(--muted)}.captain .name{color:var(--gold)}.body{padding:16px 18px}.section{color:var(--gold);font-size:10px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;margin:0 0 10px}.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.attr{background:#090d13;border:1px solid #2d3744;border-radius:7px;padding:9px}.attrline{display:flex;justify-content:space-between;gap:8px;font-size:12px}.attrline b{color:#fff}.bar{height:4px;background:#29313c;border-radius:10px;margin-top:7px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:10px}.skills{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}.skill{border:1px solid #354151;background:#0a0f16;padding:8px 9px;border-radius:6px;font-size:12px}.positive{color:#d9e8f7}.negative{color:#ff777e}.empty{color:var(--muted);font-size:12px}footer{text-align:center;padding:24px;color:#777;font-size:11px}

</style></head><body><header><img class="crest-image" src="../../assets/crests/bastard.png" alt="Escudo Bastard München"><div><h1>Bastard München</h1><p>Elenco • atributos e perícias</p></div></header><main class="wrap"><div class="intro"><h2>Fichas do time</h2><span>Capitão: Noel Noa • foco em Técnica e Drible</span></div><div class="grid" id="cards"></div></main><footer>Bastard München • ficha de elenco</footer><script>

{name:'Luke Yorin',role:'Zagueiro • Bastard München',level:'Zagueiro técnico • Nº 10',attrs:{'Drible':10,'Físico':15,'Velocidade':12,'Técnica':13,'Defesa':17,'Egoísmo':9,'Passe':13,'Leitura de Jogo':16},pos:['+3 Antecipação de Jogadas','+3 Interceptação','+2 Bloqueio','+1 Passe Curto'],neg:['-2 Explosão','-1 Drible em Velocidade'],weapon:'Leitura de Linha — intercepta passes rasteiros ao antecipar o caminho da bola.',talent:'MURALHA CALCULISTA — Quando vence um teste de Antecipação de Jogadas, recebe +2 em Interceptação na mesma jogada. Se falhar em Explosão, não pode ativar o bônus e fica exposto a atacantes velozes.'},
{name:'Kaito',role:'Zagueiro • Bastard München',level:'Zagueiro de contenção',attrs:{'Drible':9,'Físico':17,'Velocidade':13,'Técnica':11,'Defesa':18,'Egoísmo':10,'Passe':11,'Leitura de Jogo':14},pos:['+3 Marcação','+4 Desarme','+2 Bloqueio','+2 Cruzamento','+1 Jogo Aéreo'],neg:['-2 Criatividade'],weapon:'Bote de Contenção — usa força e tempo de entrada para desarmar sem abandonar a zona defensiva.',talent:'TRAVA DEFENSIVA — Após vencer um teste de Marcação ou Desarme, recebe +2 em Bloqueio até o fim da ação adversária. Como sua Criatividade é limitada, não pode usar esse talento para inventar uma jogada ofensiva inesperada.'},
{name:'Sora',role:'Lateral • Bastard München',level:'Lateral de apoio • Mobilidade',attrs:{'Drible':15,'Físico':12,'Velocidade':17,'Técnica':14,'Defesa':13,'Egoísmo':11,'Passe':14,'Leitura de Jogo':13},pos:['+3 Arrancada','+3 Desarme','+2 Cruzamento','+2 Antecipação de Jogadas','+1 Agilidade'],neg:['-2 Disputa Física','-1 Bloqueio'],weapon:'Corredor Relâmpago — arranca pela lateral e procura o Cruzamento antes que a defesa se reorganize.',talent:'IDA E VOLTA — Se vencer um teste de Arrancada, recebe +2 em Cruzamento ou Antecipação de Jogadas na sequência. Se for vencido num duelo físico, perde o bônus e não pode usar a arrancada para atravessar um bloqueio.'},

{name:'Takumi',role:'Zagueiro • Bastard München',level:'Zagueiro físico • Duelo',attrs:{'Drible':8,'Físico':18,'Velocidade':11,'Técnica':10,'Defesa':16,'Egoísmo':11,'Passe':10,'Leitura de Jogo':13},pos:['+3 Disputa Física','+3 Desarme','+2 Marcação','+2 Bloqueio','+1 Jogo Aéreo'],neg:['-2 Agilidade','-1 Precisão'],weapon:'Choque de Parede — protege a área com força, bloqueios e desarmes frontais.',talent:'ÚLTIMO PORTÃO — Quando vence uma Disputa Física, recebe +2 em Bloqueio ou Marcação para impedir a progressão do adversário. Se precisar reagir a uma mudança brusca de direção, sua Agilidade reduzida impede ativar o bônus.'},
{name:'Hezo',role:'Meia • Bastard München',level:'Meia de ligação • Controle',attrs:{'Drible':13,'Físico':11,'Velocidade':13,'Técnica':15,'Defesa':12,'Egoísmo':10,'Passe':16,'Leitura de Jogo':15},pos:['+3 Passe Curto','+3 Leitura de Jogo','+2 Domínio','+2 Explosão','+1 Antecipação de Jogadas'],neg:['-2 Execução','-1 Explosão'],weapon:'Passe de Ritmo — combina Passe Curto e Leitura de Jogo para manter a posse e encontrar o próximo espaço.',talent:'COMPASSO DO JOGO — Após vencer um teste de Leitura de Jogo, concede +2 em Passe Curto para a ação seguinte. Se a jogada exigir Execução difícil ou uma arrancada explosiva, o talento não se aplica.'},

{name:'Alexis Ness',role:'Meio-campista Central • Bastard München',level:'NV-6 · XP 0',ness:true,at:'Passador Leal',ego:'SERVIR AO IMPERADOR · Criação',archetype:'Armador de Suporte (+6 Passe)',playstyle:'Controle de Bola · Passes Curtos · Devoção · Egoísmo baixo',profile:'Alexis Ness — meio-campista central especializado em controle de bola, passes curtos e criação de jogadas. Sua devoção a Kaiser orienta suas decisões em campo.',attrs:{'Drible':24,'Velocidade':17,'Defesa':14,'Passe':25,'Físico':16,'Técnica':2,'Egoísmo':5,'Leitura de Jogo':22},mods:{'Drible':7,'Velocidade':4,'Defesa':2,'Passe':7,'Físico':3,'Técnica':2,'Egoísmo':-2,'Leitura de Jogo':6},pos:['+3 Lançamento','+7 Encandeamento','+6 Agilidade','+5 Leitura de Jogo'],neg:['-4 EGO (penalidade em testes mentais se Kaiser não estiver em campo)','-3 Execução','-3 Duelo Físico'],talent:'SERVIR AO IMPERADOR — Quando realiza um passe destinado exclusivamente a Michael Kaiser, recebe +2 no teste de passe. Se Kaiser finalizar no mesmo turno após esse passe, ele recebe +1 na rolagem. Contudo, se Ness tentar tocar a bola para outro atacante que não seja Kaiser, recebe -2 em qualquer teste de passe.',abilities:[['MAGIA DO MEIO-CAMPO','Uma vez por turno, ao usar um drible curto em espaços apertados, recebe +2 no teste contra o primeiro marcador.'],['PASSE OBCECADO — HABILIDADE MÁXIMA','Uma vez por partida, em uma situação de pressão máxima, recebe +4 no teste de passe para encontrar Kaiser, mas esgota sua ação de movimento no próximo turno, focando apenas em assistir o chute.']]},
{name:'Michael Kaiser',role:'Atacante • New Gen World XI',level:'NV-8 · XP 0',kaiser:true,at:'Finalizador Letal',ego:'KAISER IMPACT · Finalização',archetype:'Atacante de Elite (+4 Chute)',playstyle:'Finalização Perfeita · Leitura Espacial · Instinto Predador · Egoísmo extremo',profile:'Michael Kaiser — atacante de elite conhecido pela finalização perfeita, leitura espacial e instinto predador. Seu egoísmo extremo guia suas decisões ofensivas.',attrs:{'Drible':22,'Velocidade':24,'Defesa':8,'Passe':16,'Físico':20,'Técnica':24,'Egoísmo':25,'Leitura de Jogo':22},mods:{'Drible':5,'Velocidade':6,'Defesa':-1,'Passe':3,'Físico':5,'Técnica':7,'Egoísmo':7,'Leitura de Jogo':5},pos:['+5 Chute (com o bônus do arquétipo, total de +9 no máximo)','+5 Precisão','+4 Movimentação sem Bola','+4 Controlo de Bola'],neg:['-4 Trabalho em Equipa (cria atrito com os outros avançados)','-3 Defesa','-2 Passes Longos'],talent:'KAISER IMPACT — Uma vez por partida, se receber um passe sem estar sob marcação dupla na grande área, pode declarar o Kaiser Impact. Recebe +3 no teste de finalização (remate) e ignora 2 pontos de bónus defensivo do bloqueio adversário ou do guarda-redes. Se o teste falhar ou for defendido, Kaiser sofre -2 em todas as suas rolagens pelo resto do tempo devido à frustração e perda de foco.',abilities:[['ROSA AZUL','Uma vez por turno, ao receber um passe de um aliado focado em suporte (ex.: Ness), recebe +2 em testes de posicionamento.'],['EXECUÇÃO PREDATÓRIA — HABILIDADE MÁXIMA','Uma vez por partida, pode usar um aliado como “isco”. O aliado sofre -2 na sua rolagem, mas Kaiser ganha +2 para encontrar um espaço cego na defesa adversária para finalizar.']]}
,
{name:'Noel Noa',role:'Master Striker • Melhor do Mundo • Bastard München',captain:true,noa:true,level:'NV-10 — Gênio Mundial • XP: 999',at:'Futebol Total',ego:'Racional · Analítico · Individualista',archetype:'Melhor do Mundo (+3 em Técnica ou Leitura de Jogo ao analisar uma jogada)',playstyle:'Perfect Striker',profile:'Noel Noa é considerado o melhor jogador do mundo. Sua força depende da combinação de técnica, precisão e leitura de jogo. Observa o campo, calcula possibilidades e escolhe a ação mais eficiente para transformar uma oportunidade em gol. NPC chefe de elite: domínio técnico, decisões rápidas, posicionamento inteligente e finalizações eficientes.',attrs:{'Drible':28,'Físico':27,'Velocidade':28,'Técnica':35,'Defesa':25,'Egoísmo':30,'Passe':32,'Leitura de Jogo':36},pos:['+6 Técnica','+6 Leitura de Jogo','+5 Domínio','+5 Precisão','+5 Finalização','+5 Antecipação de Jogadas','+4 Passe','+4 Percepção Espacial','+4 Posicionamento','+3 Drible','+3 Desarme','+3 Controle sob Pressão','+3 Tomada de Decisão'],neg:['-5 Explosão','-3 Criatividade','-3 Desarme','-4 Egoísmo'],weapon:'Finalização de Fórmula Perfeita — escolhe a opção de chute ou passe com maior eficiência após analisar o posicionamento.',talent:'PERFECT STRIKER: EFICIÊNCIA ABSOLUTA — Passivo. +3 em Leitura de Jogo ao observar adversários; +2 em Técnica após leitura bem-sucedida; uma vez por rodada reduz em 2 uma penalidade de pressão/dificuldade; +2 em Precisão ao identificar linha livre de passe ou chute. Exige observar e identificar opção viável; surpresa, informação oculta ou caos podem impedir ativação.',abilities:[['META VISION: CAMPO COMPLETO','Ativa — Leitura de Jogo. +4 Leitura de Jogo e +3 Antecipação de Jogadas. Se a leitura for bem-sucedida, escolhe +2 em Passe, Técnica ou Precisão na ação seguinte. Pode revelar rota provável com informação suficiente. Uma vez por rodada; não prevê o futuro.'],['WORLD’S BEST: THE PERFECT FORMULA','Técnica ativa de elite. Escolha uma forma até o fim da sequência:'],['META VISION — PREDICTIVE CONTROL','+5 Leitura de Jogo, +4 Antecipação, +3 Posicionamento. Se identificar corretamente a intenção, interrompe linha de passe ou recebe em vantagem. Exige visão clara; previsão não é garantida.'],['TECHNICAL MASTER — ONE-TOUCH FINISH','+5 Técnica, +4 Precisão, +3 Finalização. Em posição favorável, pode dominar e finalizar na mesma sequência. Não funciona com passe forte, desviado ou controle inviável.'],['PERFECT PASS — KILLING PATH','+5 Passe, +4 Leitura de Jogo, +3 Precisão. Se superar leitura e interceptação, aliado recebe +2 em Técnica ou Finalização na ação seguinte. Exige companheiro e linha possível; não atravessa bloqueios nem garante assistência.'],['WORLD’S BEST: ZERO WASTE','Suprema de despertar — uso único por partida. Em situação ofensiva decisiva: +6 Leitura de Jogo, +5 Técnica, +4 Precisão, +4 Antecipação. Pode encadear leitura, posicionamento e passe/finalização se as regras permitirem; uma vez ignora penalidade de até -3 por pressão/dificuldade.'],['ZERO-ANGLE SHOT','Golpe final. +5 Técnica, +4 Precisão. Se venceu disputa de Leitura de Jogo na sequência, goleiro sofre -2 em Reação. Após a sequência, -2 Leitura de Jogo e -2 Técnica na próxima rodada.']] }
];
const modifierFor=value=>{if(value<=1)return -5;if(value<=3)return -4;if(value<=5)return -3;if(value<=7)return -2;if(value<=9)return -1;if(value<=11)return 0;if(value<=13)return 1;if(value<=15)return 2;if(value<=17)return 3;if(value<=19)return 4;if(value<=21)return 5;if(value<=23)return 6;if(value<=25)return 7;if(value<=27)return 8;if(value<=29)return 9;if(value===30)return 10;return 10+Math.ceil((value-30)/2)};
const root=document.querySelector('#cards');players.forEach(p=>{let card=document.createElement('article');card.className='card'+(p.captain?' captain':'')+(p.noa?' noa-red':'')+((p.kaiser||p.ness)?' kaiser-red':'');let attrs=Object.entries(p.attrs).map(([k,v])=>`<div class="attr"><div class="attrline"><span>${k}</span><b>${v} <small>${((p.mods&&p.mods[k]!==undefined)?p.mods[k]:modifierFor(v))>0?'+':''}${(p.mods&&p.mods[k]!==undefined)?p.mods[k]:modifierFor(v)}</small></b></div><div class="bar"><i style="width:${Math.min(100,v/20*100)}%"></i></div></div>`).join('');let skills=(list,cls)=>list.map(s=>`<div class="skill ${cls}">${s}</div>`).join('');card.innerHTML=`<div class="top"><div class="tag">${p.role}</div><div class="name">${p.name}</div><div class="sub">${p.level|| (p.captain?'Capitão do time':'Atributos e perícias')}</div></div><div class="body">${(p.noa||p.kaiser||p.ness)?`<div class="detail"><b>AT:</b> ${p.at} &nbsp; <b>EGO:</b> ${p.ego}<br><b>Arquétipo:</b> ${p.archetype}<br><b>Playstyle:</b> ${p.playstyle}</div><p class="profile">${p.profile}</p>`:''}<div class="section">Atributos</div><div class="attrs">${attrs}</div><br><div class="section">Perícias positivas</div><div class="skills">${skills(p.pos,'positive')}</div><div class="section">Perícias negativas</div><div class="skills">${skills(p.neg,'negative')}</div>${p.weapon?`<div class="section">Arma</div><div class="detail">${p.weapon}</div>`:''}${p.talent?`<div class="section">Talento exclusivo</div><div class="detail">${p.talent}</div>`:''}${p.abilities?`<div class="section">Habilidades</div>${p.abilities.map(([title,desc])=>`<div class="detail"><h4>${title}</h4>${desc}</div>`).join('')}${p.noa?`<div class="detail"><b>Observação para o mestre</b><br>Noa deve vencer pela escolha correta das ações, não por bônus automáticos. Ritmo variável, intenções ocultas e situações imprevisíveis podem desafiar sua análise.</div>`:''}`:''}</div>`;root.appendChild(card)});
</script></body></html>
