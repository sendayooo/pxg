<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubers — Central de Fichas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="selector-card">
      <div class="selector-header">
        <div>
          <p class="eyebrow">BLUE LOCK • UBERS</p>
          <h2>Selecione um jogador</h2>
          <p class="selector-help">Clique no nome ou número para abrir a ficha.</p>
        </div>
        <div class="team-badge">
          <img src="../../assets/crests/ubers.png" alt="Escudo Ubers">
        </div>
      </div>

      <div class="player-selector" id="playerSelector">
        <button class="player-button active" data-player="npc1">
          <span class="player-number">1</span>
          <small>Lateral Caçador</small>
        </button>
        <button class="player-button" data-player="npc2">
          <span class="player-number">2</span>
          <small>Volante Regista</small>
        </button>
        <button class="player-button" data-player="npc3">
          <span class="player-number">3</span>
          <small>Zagueiro de Combate</small>
        </button>
        <button class="player-button" data-player="npc4">
          <span class="player-number">4</span>
          <small>Zagueiro de Cobertura</small>
        </button>
        <button class="player-button" data-player="npc6">
          <span class="player-number">6</span>
          <small>Meia Técnico</small>
        </button>
        <button class="player-button" data-player="npc7">
          <span class="player-number">7</span>
          <small>O Fantasma Azul</small>
        </button>
        <button class="player-button" data-player="npc8">
          <span class="player-number">8</span>
          <small>O Arquiteto do Campo</small>
        </button>
        <button class="player-button" data-player="npc9">
          <span class="player-number">9</span>
          <small>O Canhão Branco</small>
        </button>
        <button class="player-button" data-player="npc10">
          <span class="player-number">10</span>
          <small>Atacante de Ruptura</small>
        </button>
        <button class="player-button" data-player="npc11">
          <span class="player-number">11</span>
          <small>O Rei Carmesim</small>
        </button>
        <button class="player-button" data-player="snuffy">
          <span class="player-number">SNUFFY</span>
          <small>O Mestre dos Ubers</small>
        </button>
      </div>
    </section>

    <div id="sheet"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
